# taplo (TOML formatter) config (Wave 7 tooling, #281).
# build/tari/config.toml is GENERATED by pithead's render (git-ignored) — a checkout that has run
# the stack carries one, and taplo globs the filesystem, not the git index (#421). Of the other
# generated files (`git clean -nX`: .env, Caddyfile, config.json), none is matched by a
# filesystem-globbing lint surface today.
exclude = ["**/uv.lock", "**/.venv/**", "**/node_modules/**", "build/tari/config.toml"]
