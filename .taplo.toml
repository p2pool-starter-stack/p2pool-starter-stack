# taplo (TOML formatter) config (Wave 7 tooling, #281).
# `make lint-toml` feeds taplo the tracked *.toml files explicitly (a filesystem walk panics on
# any unreadable dir), so these excludes matter to editor/LSP taplo runs, which still glob the
# filesystem (#421): build/tari/config.toml is GENERATED by pithead's render (git-ignored) — a
# checkout that has run the stack carries one.
exclude = [
  "**/uv.lock",
  "**/.venv/**",
  "**/node_modules/**",
  "build/tari/config.toml",
]
