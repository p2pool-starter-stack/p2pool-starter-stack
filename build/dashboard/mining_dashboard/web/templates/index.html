<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pithead Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="/static/pithead-mark.svg">
    <link rel="apple-touch-icon" href="/static/pithead-mark.svg">
    <!-- Apply the saved light/dark/auto theme before the stylesheet paints, to avoid a flash
         of the wrong palette (Issue #43). Classic blocking script, not a module, so it runs
         before first paint; same-origin so it loads under the CSP's script-src 'self'. -->
    <script src="/static/theme-init.js"></script>
    <link rel="stylesheet" href="/static/dashboard.css">
    <!-- Chart.js is a classic global (window.Chart); the app is an ES module that uses it.
         Hammer.js (window.Hammer) must load BEFORE chartjs-plugin-zoom — the plugin captures it
         at load to bind pan/pinch gestures. chartjs-plugin-zoom (UMD global ChartZoom) is
         registered in chart.mjs — gives wheel/drag-zoom + Shift-drag pan (Issue #47). -->
    <script src="/static/chart.umd.min.js"></script>
    <script src="/static/vendor/hammer.min.js"></script>
    <script src="/static/vendor/chartjs-plugin-zoom.min.js"></script>
    <script type="module" src="/static/dashboard.js"></script>
</head>
<body>
    <!-- The app is rendered here by dashboard.js, which fetches /api/state and renders with
         Preact. This static shell is just what shows before the first paint. -->
    <div id="app" class="container">
        <div class="loading">Connecting to the dashboard… If this machine is still syncing its first chain, progress appears here in a moment.</div>
    </div>
</body>
</html>
