# The hugepage pool is meant to have ONE writer on the appliance: the sizer (pithead-hugepages at
# boot, then RigForge's setup, bounded by the ceiling the miner render declares). xmrig is a second
# one (#1724). It runs as root, and before every large-page allocation it raises nr_hugepages
# through sysfs whenever free pages fall short of what it wants:
# /sys/devices/system/node/node*/hugepages/hugepages-*/nr_hugepages first, then the global
# /sys/kernel/mm/hugepages/ fallback, never /proc/sys (LinuxMemory.cpp, xmrig v6.26.0 — the version
# the baked RigForge builds). The #1103 bench watched it grow the pool 3072 -> 4608 pages with the
# sizer out of the path, and every start also asks for 1 GiB pages first (randomx.1gb-pages renders
# true), which is a write to a pool the sizer never touches.
#
# The unit is RigForge's, rendered into /run/systemd/system in appliance mode; a drop-in under
# /etc/systemd/system/<unit>.d applies to it wherever the unit file lives (systemd.unit(5)).
#
# ReadOnlyPaths NAMES THE TWO SUBTREES ON PURPOSE, and the naming is the whole mechanism. Measured
# on systemd 255 (transient units, every write echoing the current count back so the pool never
# moved, against an unprotected positive control where all three writes were ALLOWED):
# ProtectKernelTunables left /sys writable, ReadOnlyPaths=/sys left it writable too, and naming
# these two subtrees refused all three of xmrig's write paths with EROFS while /sys/.../online,
# cpulist and free_hugepages stayed readable — hwloc reads that tree for NUMA detection, which is
# why InaccessiblePaths was rejected. /dev/cpu/*/msr stays open under these settings (measured), so
# the MSR mod the unit's template calls load-bearing is untouched. THIS IMAGE SHIPS SYSTEMD 257,
# not the 255 those readings came from: the battery's provision phase reads the LIVE unit's
# ReadOnlyPaths rather than trusting them to carry over.
#
# A refused write cannot crash the miner: xmrig ignores the return value and falls back to the next
# page size, then to ordinary pages. The unit's `+` ExecStartPre lines (cpupower, nft) run outside
# this sandbox by that prefix's own definition, and its ReadWritePaths (the worker root) does not
# nest under /sys. ProtectKernelTunables is kept as the documented mechanism for the /proc/sys half
# — but it is NOT load-bearing and must not be quoted as cover: on 255 a sysctl write to
# vm.nr_hugepages was ALLOWED under it, and still allowed with /proc/sys/vm named in ReadOnlyPaths.
# No shipped xmrig writes that path; if one ever does, this file is not what stops it.
[Service]
ProtectKernelTunables=yes
ReadOnlyPaths=/sys/devices/system/node /sys/kernel/mm/hugepages
