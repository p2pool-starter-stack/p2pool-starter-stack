# A/B slot selection with boot counting — adapted from RAUC's contrib/grub.conf.
# RAUC writes ORDER/<slot>_OK/<slot>_TRY into this grubenv; GRUB picks the first slot that is
# marked OK and has not already been tried, so an update that never marks itself good falls back.
default=0
timeout=3

set ORDER="A B"
set A_OK=0
set B_OK=0
set A_TRY=0
set B_TRY=0
load_env

# Slot entries are 1 and 2, NOT 0: index 0 is the degraded entry, so `default=0` keeps its
# upstream meaning of "no slot was selectable". Numbering the slots from 0 conflates "chose slot
# A" with "found nothing" and breaks fallback — this is the exact bug the fault battery caught.
for SLOT in $ORDER; do
    if [ "$SLOT" == "A" ]; then
        INDEX=1
        OK=$A_OK
        TRY=$A_TRY
        A_TRY=1
    fi
    if [ "$SLOT" == "B" ]; then
        INDEX=2
        OK=$B_OK
        TRY=$B_TRY
        B_TRY=1
    fi
    if [ "$OK" -eq 1 -a "$TRY" -eq 0 ]; then
        default=$INDEX
        break
    fi
done

# Nothing selectable: clear the try flags so a slot marked good gets another chance next boot.
if [ "$default" -eq 0 ]; then
    if [ "$A_OK" -eq 1 -a "$A_TRY" -eq 1 ]; then
        A_TRY=0
    fi
    if [ "$B_OK" -eq 1 -a "$B_TRY" -eq 1 ]; then
        B_TRY=0
    fi
fi

save_env A_TRY A_OK B_TRY B_OK ORDER

# No rw: the root stays READ-ONLY. That is the point of the appliance — the stack cannot be
# mutated at runtime, only replaced wholesale by an update. Writable state is explicit:
# /var is an overlay whose upper layer lives on the data partition (machine state: logs,
# container storage), and /data holds operator state. See the fstab written by mkimage.sh.
CMDLINE="console=tty1 console=ttyS0 loglevel=7 panic=60"

# Index 0 — reached only when neither slot is selectable. Best effort: boot slot A rather than
# leaving the operator at a GRUB prompt on a headless machine.
menuentry "Recovery (slot A)" {
    search --no-floppy --label --set=root system-a
    linux /vmlinuz root=/dev/disk/by-partlabel/system-a $CMDLINE rauc.slot=A
    initrd /initrd.img
}

menuentry "Slot A (OK=$A_OK TRY=$A_TRY)" {
    search --no-floppy --label --set=root system-a
    linux /vmlinuz root=/dev/disk/by-partlabel/system-a $CMDLINE rauc.slot=A
    initrd /initrd.img
}

menuentry "Slot B (OK=$B_OK TRY=$B_TRY)" {
    search --no-floppy --label --set=root system-b
    linux /vmlinuz root=/dev/disk/by-partlabel/system-b $CMDLINE rauc.slot=B
    initrd /initrd.img
}
