# A/B slot selection with boot counting — adapted from RAUC's contrib/grub.conf.
# RAUC writes ORDER/<slot>_OK/<slot>_TRY into this grubenv; GRUB picks the first slot that is
# marked OK and has not already been tried, so an update that never marks itself good falls back.
default=0
timeout=3

set ORDER="A B"
set A_OK=0
set B_OK=0
set A_TRY=0
set B_TRY=0
load_env

for SLOT in $ORDER; do
    if [ "$SLOT" == "A" ]; then
        INDEX=0
        OK=$A_OK
        TRY=$A_TRY
        A_TRY=1
    fi
    if [ "$SLOT" == "B" ]; then
        INDEX=1
        OK=$B_OK
        TRY=$B_TRY
        B_TRY=1
    fi
    if [ "$OK" -eq 1 -a "$TRY" -eq 0 ]; then
        default=$INDEX
        break
    fi
done

if [ "$default" -eq 0 -a "$A_OK" -eq 0 ]; then
    if [ "$A_OK" -eq 1 -a "$A_TRY" -eq 1 ]; then
        A_TRY=0
    fi
    if [ "$B_OK" -eq 1 -a "$B_TRY" -eq 1 ]; then
        B_TRY=0
    fi
fi

save_env A_TRY A_OK B_TRY B_OK ORDER

# rw: systemd needs a writable root for /var and machine state. Operator state lives on
# /data regardless (RAUC replaces the whole slot on update, so nothing in / survives).
CMDLINE="rw console=tty1 console=ttyS0 loglevel=7 panic=60"

menuentry "Slot A (OK=$A_OK TRY=$A_TRY)" {
    search --no-floppy --label --set=root system-a
    linux /vmlinuz root=/dev/disk/by-partlabel/system-a $CMDLINE rauc.slot=A
    initrd /initrd.img
}

menuentry "Slot B (OK=$B_OK TRY=$B_TRY)" {
    search --no-floppy --label --set=root system-b
    linux /vmlinuz root=/dev/disk/by-partlabel/system-b $CMDLINE rauc.slot=B
    initrd /initrd.img
}
