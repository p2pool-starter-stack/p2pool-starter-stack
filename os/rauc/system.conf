# RAUC system configuration for the pithead appliance (bake-off candidate B).
# Two redundant rootfs slots + a data partition. The grubenv deliberately lives on the EFI
# partition, outside both slots, so replacing a slot never touches boot state. It must sit in
# GRUB's prefix directory (/grub), because bare `load_env` reads $prefix/grubenv — at the ESP
# root RAUC writes it correctly and GRUB never reads it.
[system]
compatible=pithead-amd64
bootloader=grub
grubenv=/boot/efi/grub/grubenv
data-directory=/data/rauc

[keyring]
path=/etc/rauc/keyring.pem

[slot.rootfs.0]
device=/dev/disk/by-partlabel/system-a
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-partlabel/system-b
type=ext4
bootname=B
