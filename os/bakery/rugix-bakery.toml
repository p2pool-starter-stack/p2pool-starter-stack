# Pithead OS image builds (#77 phase 2). One system today: the x86_64 EFI appliance.
# `os/build-image.sh` assembles the rootfs tarball first, then bakes.

[systems.pithead-os-amd64]
layer = "pithead-os"
architecture = "amd64"
target = "generic-grub-efi"

# The BAKED image layout — distinct from the runtime bootstrapping.toml, which expands to full
# A/B on first boot. The root = "config"/"boot"/"system" markers are what rugix-ctrl reads in the
# initramfs to find the system partition (without them it exits and the kernel panics). Structure
# is the field-proven umbrelOS amd64 layout; hash-seed/UUID are ours.
[systems.pithead-os-amd64.image.layout]
type = "gpt"
partitions = [
    { root = "config", type = "C12A7328-F81F-11D2-BA4B-00A0C93EC93B", size = "256M", filesystem = { type = "fat32" } },
    { root = "boot", size = "512MiB", filesystem = { type = "ext4" } },
    { size = "512M" },
    { root = "system", filesystem = { type = "ext4", additional-options = [
        "-O", "^has_journal",
        "-E", "hash_seed=586b6c6a-aba3-460d-ac95-f2e33973c87f",
        "-U", "627e353c-6a0f-4355-9856-b8768e3028c4",
    ] } },
]
