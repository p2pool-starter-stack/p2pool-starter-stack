# Slot A ships populated inside the image. Fixed size: an A/B pair must stay interchangeable, and
# a slot that grew on one machine could no longer receive a bundle built for the other.
# 4 GiB is load-bearing for small boot media — repart is transactional, so the medium must fit
# ESP + both slots + data's minimum or nothing is created and boot fails (see mkimage.sh).
[Partition]
Type=linux-generic
Label=system-a
SizeMinBytes=4G
SizeMaxBytes=4G
