# Operator state: config, wallets, chain data, container storage. This is the partition that must
# fit the machine rather than the image — a Monero chain alone is 250+ GB, and an image-sized /data
# is the reason install-to-disk could not ship.
#
# No SizeMaxBytes and all the weight, so it takes everything the fixed partitions leave.
# GrowFileSystem extends the filesystem after the partition, which is the half people forget.
[Partition]
Type=linux-generic
Label=data
Format=ext4
SizeMinBytes=4G
Weight=1000
GrowFileSystem=yes
# Seeded at format time, because /var is an overlay whose upper and work directories live here and
# the mount happens before anything could create them. MakeDirectories only runs when repart
# formats the partition, so an existing /data on a reinstall is never touched.
MakeDirectories=/overlay/var
MakeDirectories=/overlay/var-work
MakeDirectories=/pithead
