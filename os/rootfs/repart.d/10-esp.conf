# The appliance layout, declared once. systemd-repart matches these against what is already on
# the disk, creates what is missing, and grows what can grow — so the shipped image carries only
# the ESP and slot A, and the target machine builds the rest to fit its own disk on first boot.
#
# Order matters: definitions are matched to existing partitions in file-name order, so 20-system-a
# claims the populated slot the image shipped and 30-system-b is created empty beside it.
[Partition]
Type=esp
Label=ESP
Format=vfat
SizeMinBytes=256M
SizeMaxBytes=256M
