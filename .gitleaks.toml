# gitleaks secret-scan config (Wave 7 tooling, #282). Extends the upstream default ruleset.
[extend]
useDefault = true

[allowlist]
description = "Accepted false positives"
regexTarget = "line"
# curl auth assembled from shell ENV VARS (e.g. `-u "${USER:-}:${PASS:-wallet}"`) is not a hardcoded
# secret — the upstream `curl-auth-user` rule can't distinguish `${VAR}` from a literal credential.
# Both sides must be `${VAR:-default}` expansions (default optional), so a real `-u "admin:hunter2"`
# is still caught.
regexes = [
  '''-u "\$\{[A-Z_]+:-[^}]*\}:\$\{[A-Z_]+:-[^}]*\}"''',
  # Fixture password in the wizard handoff-card frontend test — a made-up literal the test
  # asserts is RENDERED, so it can't be replaced with an env var. CI scans every pushed ref,
  # so this must be allowlisted even while the branch that carries it is still in flight.
  '''rX6d2A4sGBHFEcQT4TVQQJRQg7xtbDMg''',
]
