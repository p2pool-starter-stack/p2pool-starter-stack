name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  # Two Monday sweeps hang off this schedule, answering two different questions. Every other job
  # gates itself off the event, so only these two run.
  #
  #   build-images  (#833) rebuilds every image from the branch and scans the rebuild: does what
  #                 we are about to ship carry a CVE? It is the only sweep that can go red before
  #                 a release, and the run reddening in the Actions tab is its alert.
  #   sweep-shipped (#1313) scans what users are already running — the published ghcr images from
  #                 `main`, each tag resolved to a digest and the digest scanned as published. A
  #                 rebuild structurally cannot answer that: it resolves apt at scan time, so it
  #                 picks up archive fixes the published bytes never got. It reports into a
  #                 tracking issue rather than reddening, because "a shipped image has a fixable
  #                 CVE" asks for a patch release, which is a decision a person makes.
  #
  # NEITHER FIRES FROM THIS FILE — `schedule:` is read from the DEFAULT branch only, so both run
  # from `develop`'s copy and this cron block is inert. It is here so the twins stay level, and so
  # `make lint-trivy-parity` (this lane only) covers sweep-shipped's trivy step at all. Change the
  # cadence on `develop`, and prove it fired with `gh run list --json event`.
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC

# Least privilege (#282): every job here only reads the repo — none push commits, comment, or
# publish packages. Narrowing the default GITHUB_TOKEN limits the blast radius of a compromised step.
permissions:
  contents: read

# Cancel superseded runs of the same PR; never cancel push runs on main/develop (they set the
# diff-cover baseline and are required checks on the protected branch). #415.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dashboard:
    name: Dashboard tests (pytest + coverage)
    if: github.event_name != 'schedule' # scheduled runs are the CVE sweep — build-images only (#833)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON_DOWNLOADS: never  # use the setup-python 3.11; don't fetch another interpreter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # full history so diff-cover can diff the PR against origin/develop (#286)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: "Install uv (pinned — reproducible, hash-locked installs, #283)"
        # Curl the pinned installer (same posture as hadolint below); avoids a mutable-tag action.
        run: |
          export UV_INSTALL_DIR="$HOME/.local/bin"   # deterministic install dir (runners may set CARGO_HOME)
          curl -LsSf https://astral.sh/uv/0.10.10/install.sh -o /tmp/uv-install.sh; sh /tmp/uv-install.sh # download then run, never a pipe: the pipeline's status is sh's, which is 0 on empty input, so a failed download passed this step (#1788)
          echo "$UV_INSTALL_DIR" >> "$GITHUB_PATH"
      - name: Dashboard tests + coverage gate (emits coverage.xml)
        run: make test-dashboard
      - name: "Patch-coverage gate — changed lines >=90% (diff-cover vs the PR's own base, #286)"
        # GITHUB_BASE_REF is set on pull_request runs; push runs fall back to develop. Grading a PR
        # against develop instead of its base branch charges it the base branch's whole coverage
        # debt (a bash-only appliance PR once failed on wizard.py lines it never touched).
        run: |
          git fetch --no-tags origin develop "${GITHUB_BASE_REF:-develop}"
          make test-patch-coverage
      - name: Fake-daemon contract test (real clients vs controllable fakes)
        # Points the real Monero/Tari clients at the integration fakes and asserts they parse
        # every state (synced/syncing/down). Docker-free, so it runs on every PR (issue #54).
        run: make test-fakes

  frontend:
    name: Frontend logic tests (node --test)
    if: github.event_name != 'schedule' # scheduled runs are the CVE sweep — build-images only (#833)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      # Pure client logic (worker sort, tooltip formatting) lives in static/logic.mjs and is
      # tested with Node's built-in runner — no package.json/node_modules/build step. Component
      # rendering is covered by a manual browser smoke test, not here.
      - name: Run frontend logic tests
        run: node --test dashboard/tests/frontend/*.test.mjs

  dashboard-image:
    name: Dashboard image (Docker test stage)
    if: github.event_name != 'schedule' # scheduled runs are the CVE sweep — build-images only (#833)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the dashboard test stage (installs package + runs the suite in-container)
        run: docker build --target test ./dashboard

  build-images:
    # Build every build/* image, plus dashboard/ (moved out of build/, #1106), so a broken
    # Dockerfile / COPY path / entrypoint / pinned-digest is caught in CI instead of at deploy
    # time (#124). Previously only the dashboard test stage was built, so e.g. the Tor image's
    # entrypoint restructure (#180) shipped with no CI safety net. Tari is an upstream image (no
    # Dockerfile here), so it's excluded. fail-fast: false so one broken image doesn't hide the
    # others; empty build-args keep the dashboard build working bare.
    name: Build image (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: monero
            context: build/monero
          - service: p2pool
            context: build/p2pool
          - service: tor
            context: build/tor
          - service: xmrig-proxy
            context: build/xmrig-proxy
          - service: dashboard
            context: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: docker build ./${{ matrix.context }}
        run: docker build -t "pithead-${{ matrix.service }}:ci" "./${{ matrix.context }}"
      - name: Scan image for CVEs (Trivy)
        # Gate on actionable (fixable) HIGH/CRITICAL only; accepted findings live in .trivyignore.
        # Must stay green before v1.1 images publish (#282).
        #
        # cache: false is load-bearing (#1159). The action caches the vulnerability database under
        # `cache-trivy-$(date +%F)`, and Actions caches are immutable and scoped per ref — so the
        # first run of the calendar day on a branch freezes that branch's database until midnight.
        # On 2026-08-20 the identical dashboard image passed on one branch and failed on another 40
        # seconds apart, because one restored a snapshot written at 00:15 and the other one written
        # at 13:33. A gate whose answer depends on when its branch last started a run is not a gate.
        # Measured cost of downloading it every time: 108.49 MiB from mirror.gcr.io/aquasec/trivy-db
        # in 3.3s, against the 13.9s the ~997 MB cache restore was taking. It also returns ~7.5 GB of
        # the repo's 10 GB Actions cache budget, which was 92% near-duplicate copies of this one DB.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Explicit on purpose (#1290) — the action's default engine moves whenever the action is
          # bumped, and scripts/trivyignore-watch.sh's verdicts only mean something when it scans
          # with the engine the gate runs. `make lint-trivy-parity` holds the two to one value.
          version: v0.74.0
          image-ref: pithead-${{ matrix.service }}:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
          cache: "false"

  sweep-shipped:
    # The half of the Monday sweep that reports on what users are running (#1313). `build-images`
    # above scans a rebuild of this branch; this scans the bytes on the registry.
    #
    # Every leg resolves the published TAG to a DIGEST and scans the digest. That is not
    # ceremony: a tag is a moving pointer, so "we scanned :v1.20.0" stops being a statement about
    # any particular image the moment it moves, and the digest is the only reference that names
    # the bytes a user pulled. The digest scanned is printed in the report.
    #
    # fail-fast: false so one unreachable image does not hide the other four — and a leg that
    # fails still shows up, because the report job runs on `always()` and names any image it
    # received no scan for as UNCHECKED rather than counting it as clean.
    name: Shipped-image CVE sweep (${{ matrix.service }})
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [monero, p2pool, tor, xmrig-proxy, dashboard]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the shipped tag to a digest, and take main's own .trivyignore
        id: shipped
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -Eeuo pipefail
          # The scheduled run checks out develop. `main` is a different ref and a shallow clone
          # does not carry it, so fetch it rather than assume it is here — since #1076 `main` is a
          # fast-forward pointer to the released tag, and it is the only ref that knows what
          # shipped.
          git fetch --no-tags --depth=1 origin main
          ver="$(git show origin/main:VERSION)"
          [ -n "$ver" ] || { echo "::error::main carries no VERSION — cannot tell what shipped"; exit 1; }
          tag="v$ver"
          # main's OWN .trivyignore, never develop's. A mute added after the cut would otherwise
          # silence a finding in an image whose review never saw that mute.
          git show origin/main:.trivyignore >main.trivyignore
          repo="p2pool-starter-stack/pithead-$SERVICE"
          # The packages are public, so an anonymous pull token is enough — no registry secret
          # enters this workflow.
          token="$(curl -fsS "https://ghcr.io/token?scope=repository:$repo:pull" | jq -er .token)"
          digest="$(curl -fsSI \
            -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/$repo/manifests/$tag" |
            tr -d '\r' | awk 'tolower($1) == "docker-content-digest:" { print $2 }')"
          # An unresolved digest must never fall through to a tag scan: the report would then say
          # "shipped image" about bytes nobody can identify. Fail the leg instead and let it read
          # UNCHECKED.
          printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$' ||
            { echo "::error::could not resolve ghcr.io/$repo:$tag to a digest — got [$digest]"; exit 1; }
          echo "ref=ghcr.io/$repo@$digest" >>"$GITHUB_OUTPUT"
          # The tag every leg swept, so the report can refuse to mix two releases if a cut lands
          # mid-run.
          printf '%s\n' "$tag" >"sweep-$SERVICE.tag"
      - name: Scan the published image by digest (Trivy)
        # Same scope as the gate above, and the same engine — but only because #1290's pin is on
        # both steps. Read that as a dependency, not a coincidence: comparing this sweep's verdict
        # against the rebuild's is the whole reason both exist, and two trivy releases apart is
        # enough to make them disagree for reasons that have nothing to do with the images. If the
        # step above ever loses its `version:`, this comparison stops meaning anything, and on
        # nothing but `make lint-trivy-parity` will say so.
        #
        # trivy pulls the digest from the registry itself — nothing is built here.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: ${{ steps.shipped.outputs.ref }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # Report-only, deliberately. A fixable CVE in an image that is already published cannot
          # be fixed by failing this run; it asks for a patch release. The run goes red only when
          # the sweep itself could not do its job, which the report job decides.
          exit-code: "0"
          trivyignores: main.trivyignore
          cache: "false"
          format: json
          output: sweep-${{ matrix.service }}.json
      - name: Upload this image's scan output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shipped-sweep-${{ matrix.service }}
          path: |
            sweep-${{ matrix.service }}.json
            sweep-${{ matrix.service }}.tag
          # An empty upload would reach the report job as a scan that found nothing, which is the
          # one thing this must never say off a leg that did not scan.
          if-no-files-found: error

  sweep-shipped-report:
    # One tracking issue, edited in place — the pin-watch.yml / trivyignore-watch.yml posture. An
    # issue persists, is assignable, and lets a person write "held until the next cut, here's why"
    # in a comment. A red square in the Actions tab cannot hold that, and this finding's whole
    # value is the conversation about whether to cut a patch release.
    name: Shipped-image CVE sweep — tracking issue
    # always() so a failed scan leg still reports: an image with no scan output is UNCHECKED, and
    # saying so is the entire point. Skipping the report on a partial sweep would leave the last
    # good report standing as if it were current.
    if: always() && github.event_name == 'schedule'
    needs: sweep-shipped
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Least privilege (#282): issues.write is this job's one output — it never pushes or publishes.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Collect every leg's scan output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: shipped-sweep-*
          merge-multiple: true
          path: shipped-sweep
      - name: Render the report
        id: report
        run: |
          set -uo pipefail
          # NOT `set -e`: an incomplete sweep is a result to publish, not a reason to publish
          # nothing. The script names the images it could not check and exits 1; the rc is
          # carried to the last step so the run still fails loudly.
          bash scripts/shipped-image-sweep-report.sh shipped-sweep >report.md
          rc=$?
          # An empty report is itself a failure to report — never publish silence.
          [ -s report.md ] || { echo "The shipped-image sweep produced no report at all — see the run log." >report.md; rc=1; }
          echo "rc=$rc" >>"$GITHUB_OUTPUT"
      - name: Publish it to the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          RC: ${{ steps.report.outputs.rc }}
        run: |
          set -Eeuo pipefail
          # The title is the upsert key and it lives in the script, so there is exactly one
          # spelling of it anywhere. A second spelling here would file a second issue on the very
          # next run and then keep both stale.
          TITLE="$(bash scripts/shipped-image-sweep-report.sh --title)"
          body=$(cat report.md)
          # Exact title match over the open list, NOT `--search`: the search index lags issue
          # creation by minutes, so a search-based dedup files a second issue on the next run.
          n=$(gh issue list --state open --limit 200 --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          # A run that could not do its job must not DELETE the "last fully successful" date —
          # that date is the only thing separating "failed once this morning" from "has been dead
          # for six weeks". Stamp it on success, carry it forward on failure (pin-watch pattern).
          if [ "$RC" = "0" ]; then
            body="$body"$'\n\n'"_Last fully successful sweep: $(date -u +%F)_"
          elif [ -n "$n" ]; then
            prev=$(gh issue view "$n" --json body --jq .body | grep -a "^_Last fully successful sweep:" || true)
            if [ -n "$prev" ]; then
              body="$body"$'\n\n'"$prev (this run could not complete)"
            fi
          fi
          if [ -n "$n" ]; then
            gh issue edit "$n" --body "$body"
            echo "updated #$n"
          else
            gh issue create --title "$TITLE" --label infra --body "$body"
          fi
      - name: Fail the run if the sweep could not cover every shipped image
        if: steps.report.outputs.rc != '0'
        run: |
          echo "::error::the shipped-image sweep did not cover every published image — those images are UNCHECKED, not clean"
          exit 1

  hadolint:
    name: Dockerfile lint (hadolint)
    if: github.event_name != 'schedule' # scheduled runs are the CVE sweep — build-images only (#833)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Install hadolint (pinned + sha256-verified, #286)"
        run: |
          curl -fsSL -o /tmp/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          echo "56de6d5e5ec427e17b74fa48d51271c7fc0d61244bf5c90e828aab8362d55010  /tmp/hadolint" | sha256sum -c -
          sudo install -m 0755 /tmp/hadolint /usr/local/bin/hadolint
      - name: Lint all build/* and dashboard/ Dockerfiles (config in .hadolint.yaml)
        run: hadolint build/*/Dockerfile dashboard/Dockerfile

  python-lint:
    name: Python lint + format (ruff)
    if: github.event_name != 'schedule' # scheduled runs are the CVE sweep — build-images only (#833)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install uv (pinned)
        run: |
          export UV_INSTALL_DIR="$HOME/.local/bin"   # deterministic install dir (runners may set CARGO_HOME)
          curl -LsSf https://astral.sh/uv/0.10.10/install.sh -o /tmp/uv-install.sh; sh /tmp/uv-install.sh # never a pipe — see the dashboard job's copy (#1788)
          echo "$UV_INSTALL_DIR" >> "$GITHUB_PATH"
      - name: ruff check + format --check (config in dashboard/pyproject.toml + root ruff.toml)
        # Single source of truth: the Makefile `lint-py` target, which runs ruff via uv from the
        # locked `dev` extra — one pinned ruff for CI, pre-commit, and local devs.
        run: make lint-py

  gitleaks:
    name: Secret scan (gitleaks)
    if: github.event_name != 'schedule' # scheduled runs are the CVE sweep — build-images only (#833)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # full history so the scan covers every commit, not just the tip
      - name: Scan git history for secrets (gitleaks, pinned by digest)
        # Run the binary via its pinned image (the gitleaks-action requires a license for org repos).
        # Accepted false positives live in .gitleaks.toml.
        run: |
          docker run --rm -v "$PWD":/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --no-banner --redact --config /repo/.gitleaks.toml

  zizmor:
    name: Workflow audit (zizmor)
    if: github.event_name != 'schedule' # scheduled runs are the CVE sweep — build-images only (#833)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install uv (pinned)
        run: |
          export UV_INSTALL_DIR="$HOME/.local/bin"
          curl -LsSf https://astral.sh/uv/0.10.10/install.sh -o /tmp/uv-install.sh; sh /tmp/uv-install.sh # never a pipe — see the dashboard job's copy (#1788)
          echo "$UV_INSTALL_DIR" >> "$GITHUB_PATH"
      - name: Audit workflows (injection, token scope, self-hosted-runner risks)
        run: uvx zizmor@1.25.2 --offline .github/workflows/

  shell:
    name: Shell tests (shellcheck + pithead suite)
    if: github.event_name != 'schedule' # scheduled runs are the CVE sweep — build-images only (#833)
    runs-on: ubuntu-latest
    timeout-minutes: 25 # 11-15 min is this job's honest range on the appliance lane (73 runs: 633-902 s, 21 within 60 s of the old 900 s cap) and two runs were cancelled AT it (#1789)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Install shellcheck + shfmt (pinned + sha256-verified, #286)"
        # Direct upstream-release downloads with a sha256 check (RigForge convention) instead of the
        # runner's preinstalled shellcheck / apt — reproducible, and immune to the apt-mirror
        # flakiness of #64. Both versions come from the Makefile — shellcheck's since #1679, shfmt's since #1688.
        run: |
          SF=$(make -s print-shfmt-version) # the Makefile is the pin; `make lint-sh` below refuses any other version (#1688)
          curl -fsSL -o /tmp/shfmt "https://github.com/mvdan/sh/releases/download/v$SF/shfmt_v${SF}_linux_amd64"
          echo "fb096c5d1ac6beabbdbaa2874d025badb03ee07929f0c9ff67563ce8c75398b1  /tmp/shfmt" | sha256sum -c -
          sudo install -m 0755 /tmp/shfmt /usr/local/bin/shfmt
          SC=$(make -s print-shellcheck-version) # the Makefile is the pin; `make lint-sh` below refuses any other version (#1679)
          curl -fsSL -o /tmp/sc.tar.xz "https://github.com/koalaman/shellcheck/releases/download/v$SC/shellcheck-v$SC.linux.x86_64.tar.xz"
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  /tmp/sc.tar.xz" | sha256sum -c -
          tar -xJf /tmp/sc.tar.xz -C /tmp
          sudo install -m 0755 "/tmp/shellcheck-v$SC/shellcheck" /usr/local/bin/shellcheck
      - name: Lint pithead, build/* + dashboard/ container scripts, and test scripts (shellcheck + shfmt)
        # Single source of truth: the Makefile `lint-sh` target (so the file list can't drift
        # between here and the Makefile). Covers build/*/*.sh and dashboard/*.sh — the entrypoints
        # + healthchecks that run in every container (#124). Gate on warnings+errors; info-level style nits vary by
        # shellcheck version. Python lint runs in its own `python-lint` job (ruff isn't on this
        # runner; `make lint` runs both for local devs).
        run: make lint-sh
      - name: Run pithead test suite
        run: bash tests/stack/run.sh
      - name: Run real-image data-reset suite
        # Real ext4 damage against the product's own repair escalation (#1062). Unprivileged —
        # e2fsprogs on plain files — and it hard-fails rather than skips when CI lacks the tools.
        run: bash tests/stack/test_data_reset.sh
      - name: Run OS-update recovery suite
        # #1050 dead-end states re-arm and report; standalone suite wired here because the shell-tests job runs each
        # standalone file explicitly (Makefile test-stack alone never runs in CI).
        run: bash tests/stack/test_os_update_recovery.sh
      - name: Run first-boot journal suite
        # #1030 journal persistence across interrupts; standalone suite wired here because the shell-tests job runs each
        # standalone file explicitly (Makefile test-stack alone never runs in CI).
        run: bash tests/stack/test_firstboot_journal.sh
      - name: Run appliance hugepages suite
        # #1103 co-location refusal on the reduced tier; standalone suite wired here because the shell-tests job runs each
        # standalone file explicitly (Makefile test-stack alone never runs in CI).
        run: bash tests/stack/test_appliance_hugepages.sh
      - name: Test-inventory drift check
        # The inventory generator is grep-based; it exits non-zero when any suite it
        # enumerates counts zero — i.e. a suite moved or changed shape and the inventory
        # would silently under-count (#981). Output discarded: the generated file is
        # git-ignored and read on demand via `make test-inventory`.
        run: bash tests/inventory.sh > /dev/null
      - name: Run integration harness self-test
        # Pure-logic checks for the tests/integration/ harness (config rendering, matrix
        # coverage, redaction). The LIVE matrix (tests/integration/run.sh) needs a real test
        # server and runs as a gated/manual release gate (#54), not on every PR.
        run: |
          # Globbed, not enumerated: an enumerated list silently omits any self-test added later.
          for t in tests/integration/selftest*.sh; do bash "$t"; done

  compose:
    name: Compose config + security hardening
    if: github.event_name != 'schedule' # scheduled runs are the CVE sweep — build-images only (#833)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate docker-compose.yml interpolation + hardening invariants (#90)
        run: bash tests/stack/test_compose.sh

  lint-surfaces:
    name: Lint per-surface (biome, yaml, markdown, proto, toml)
    if: github.event_name != 'schedule' # scheduled runs are the CVE sweep — build-images only (#833)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # lint-file-budget's ratchet needs origin/develop to exist, or it skips (#1452, #1608)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install uv (pinned)
        run: |
          export UV_INSTALL_DIR="$HOME/.local/bin"
          curl -LsSf https://astral.sh/uv/0.10.10/install.sh -o /tmp/uv-install.sh; sh /tmp/uv-install.sh # never a pipe — see the dashboard job's copy (#1788)
          echo "$UV_INSTALL_DIR" >> "$GITHUB_PATH"
      - name: Lint docs voice, operator strings, topology classes, file budget, trivy parity, then JS/CSS (Biome), YAML, Markdown, proto (buf), TOML (taplo)
        # Single source of truth: the Makefile targets. REPO-LOCAL GATES FIRST (#1746): the five bash ones cost under 6s between them, while the five after them fetch via npx/uvx/docker and have eaten the whole 15-minute timeout on a slow registry.
        run: make lint-docs-voice lint-operator-strings lint-topology lint-file-budget lint-trivy-parity lint-js lint-yaml lint-md lint-proto lint-toml
